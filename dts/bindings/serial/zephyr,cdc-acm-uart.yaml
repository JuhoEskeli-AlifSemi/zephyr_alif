description: USB Host CDC-ACM UART bridge

  This binding defines a virtual UART backed by a USB host CDC-ACM
  class driver. It allows drivers that use the Zephyr UART API
  (such as modem drivers) to communicate with USB CDC-ACM devices
  (such as USB modems).

compatible: "zephyr,cdc-acm-uart"

properties:
  rx-fifo-size:
    type: int
    default: 2048
    description: |
      Size of the receive ring buffer in bytes.

  tx-fifo-size:
    type: int
    default: 2048
    description: |
      Size of the transmit ring buffer in bytes.
