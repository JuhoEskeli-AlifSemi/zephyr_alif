# zperf over wired Ethernet on the Alif E7 DevKit (RTSS-HP core).
# Direct PC-to-board wiring: no DHCP server, use the static IPv4
# addresses configured in the sample prj.conf (board = 192.0.2.1,
# peer/PC = 192.0.2.2).

# Ethernet MAC (DesignWare) + RTL8201FR PHY over MDIO
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_ETH_DRIVER=y
CONFIG_ETH_DWMAC=y
CONFIG_MDIO=y
CONFIG_PHY_REALTEK_RTL8201FR=y

# Native IP stack, static addressing (no DHCP for direct wiring)
CONFIG_NET_NATIVE=y
CONFIG_NET_DHCPV4=n

# DMA descriptors/buffers require cache management on the M55
CONFIG_CACHE_MANAGEMENT=y
CONFIG_DCACHE=y
